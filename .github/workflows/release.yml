name: Release

# Pushing a tag like v1.6.1 runs the full CI, publishes the multi-arch image to GHCR and
# creates the GitHub Release with bilingual notes taken from CHANGELOG.md / CHANGELOG.es.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # GHCR (and the attestation subject) need a lowercase name; the owner is "Consterna"
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # Multi-arch images: GHCR reads the description / source from the image index
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          # "latest" is only added for stable versions, never for pre-release tags
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records only exist for organization-owned repositories
          create-storage-record: false

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test the release-notes script
        run: node --test scripts/release-notes.test.mjs

      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$version" > notes.md
          {
            echo
            echo '### Docker'
            echo
            echo '```sh'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY,,}:${version}"
            echo '```'
          } >> notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Release assets
        run: |
          mkdir dist-release
          cp obs-scripts/streamcollab-hotkeys.lua dist-release/
          cd dist-release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest asset provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist-release/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --title "StreamCollab $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            "${prerelease[@]}" \
            dist-release/*
